name: Taiwan Stock Daily Batch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'refresh=full market; all=bounded backfill; scan=ranking only'
        required: true
        default: refresh
        type: choice
        options: [refresh, all, universe, ingest, scan]
      batch_size:
        description: 'Refresh chunk size / backfill symbol count'
        required: true
        default: '120'
        type: string
  schedule:
    # Taiwan 15:40 Monday-Friday, 07:40 UTC. Scheduled starts may be delayed.
    - cron: '40 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: taiwan-stock-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RUN_MODE: ${{ inputs.mode || 'refresh' }}
      BATCH_SIZE: ${{ inputs.batch_size || '120' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'Missing DATABASE_URL GitHub Actions secret'
            exit 1
          fi
      - name: Run daily batch
        shell: bash
        run: |
          if [ "$RUN_MODE" = 'refresh' ]; then
            python -m scripts.pipeline --mode refresh --limit "$BATCH_SIZE" --workers 3 --period 1mo
          else
            python -m scripts.pipeline --mode "$RUN_MODE" --limit "$BATCH_SIZE" --workers 2 --period 1y
          fi
