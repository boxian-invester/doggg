name: Taiwan Stock Daily Batch
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'all / universe / ingest / scan'
        required: true
        default: 'all'
        type: choice
        options: [all, universe, ingest, scan]
      batch_size:
        description: 'Number of symbols to ingest per run'
        required: true
        default: '60'
  schedule:
    # 15:40 Taipei, Mon-Fri; updates after Taiwan close. UTC does not observe DST.
    - cron: '40 7 * * 1-5'
    # 08:15 Taipei, Mon-Fri; morning catch-up, not a guaranteed 08:45 publication.
    - cron: '15 0 * * 1-5'
permissions:
  contents: read
concurrency:
  group: taiwan-stock-batch
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BATCH_SIZE: ${{ inputs.batch_size || '60' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then echo 'Missing DATABASE_URL GitHub Actions secret'; exit 1; fi
      - name: Run incremental batch
        run: python -m scripts.pipeline --mode "${{ inputs.mode || 'all' }}" --limit "$BATCH_SIZE" --workers 2 --period 1y
