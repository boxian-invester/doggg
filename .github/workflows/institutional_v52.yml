name: Taiwan v5.2 Institutional Data Import
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Calendar days to backfill (35 recommended)'
        required: true
        default: '35'
      dry_run:
        description: 'Preview only, do not write database'
        type: boolean
        required: true
        default: true
  schedule:
    - cron: '40 11 * * 1-5' # 19:40 Asia/Taipei, weekdays; exchange holidays safely skipped
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Import TWSE official institutional data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS: ${{ github.event.inputs.days || '14' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/institutional_v52.py --days "$DAYS" --dry-run
          else
            python scripts/institutional_v52.py --days "$DAYS"
          fi
