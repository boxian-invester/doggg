name: Taiwan Market v6.8 Calibration Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'psycopg[binary]>=3.1,<4'
      - name: Run research-only audit
        run: python -m scripts.market_model_v68_audit
