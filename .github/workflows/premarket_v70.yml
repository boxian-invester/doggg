name: Taiwan Market v7.0 Manual Premarket Pilot
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Taiwan trading date YYYY-MM-DD (confirm exchange is open)'
        required: true
        type: string
      save_prediction:
        description: 'Save immutable research prediction? First run false.'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TARGET_DATE: ${{ inputs.target_date }}
      SAVE_PREDICTION: ${{ inputs.save_prediction }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'psycopg[binary]>=3.1,<4'
      - name: Run manual pilot
        run: python -m scripts.premarket_v70
