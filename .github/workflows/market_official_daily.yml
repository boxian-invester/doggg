name: Taiwan Market Official Daily History
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Calendar days to backfill (1-365)'
        type: choice
        default: '90'
        required: true
        options:
          - '7'
          - '30'
          - '90'
          - '180'
  schedule:
    # 18:30 Taiwan time, Monday-Friday (UTC 10:30)
    - cron: '30 10 * * 1-5'
permissions:
  contents: read
concurrency:
  group: market-official-daily
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'psycopg[binary]>=3.1,<4' 'yfinance>=0.2.50,<2' 'beautifulsoup4>=4.12,<5'
      - name: Backfill official history
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: python -m scripts.market_official_backfill --days "$DAYS"
