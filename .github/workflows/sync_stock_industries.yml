name: Sync TWSE TPEx Industry Classifications
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5' # 19:30 Taiwan; schedule may be delayed
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg2-binary>=2.9,<3'
      - name: Sync industry from official exchanges
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_stock_industries.py
