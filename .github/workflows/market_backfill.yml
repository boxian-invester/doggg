name: Taiwan Stock Market Index Backfill
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Historical years to backfill'
        type: choice
        required: true
        default: '5'
        options:
          - '3'
          - '5'
      mode:
        description: 'daily (last 21 calendar days) or full backfill'
        type: choice
        required: true
        default: 'daily'
        options:
          - 'daily'
          - 'backfill'
  schedule:
    # 09:30 UTC = 17:30 Taiwan; US previous trading session has closed.
    - cron: '30 9 * * 1-6'
permissions:
  contents: read
concurrency:
  group: market-daily-bars
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2.0,<3' 'yfinance>=0.2.50,<2' 'psycopg[binary]>=3.1,<4'
      - name: Validate database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing DATABASE_URL secret"
            exit 1
          fi
      - name: Update market indexes
        env:
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          YEARS: ${{ github.event.inputs.years || '5' }}
        run: python -m scripts.market_backfill --mode "$MODE" --years "$YEARS"
