name: Taiwan Stock Daily Batch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all / universe / ingest / scan"
        required: true
        default: all
        type: choice
        options:
          - all
          - universe
          - ingest
          - scan
      batch_size:
        description: "Number of symbols to ingest per run"
        required: true
        default: "120"
        type: string
  schedule:
    # Taipei 08:45, Monday to Friday (UTC+8)
    - cron: "45 0 * * 1-5"
    # Taipei 15:40, Monday to Friday (UTC+8)
    - cron: "40 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: taiwan-stock-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BATCH_SIZE: ${{ inputs.batch_size || '120' }}
      RUN_MODE: ${{ inputs.mode || 'all' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing DATABASE_URL GitHub Actions secret"
            exit 1
          fi
      - name: Run incremental batch
        shell: bash
        run: |
          python -m scripts.pipeline \
            --mode "$RUN_MODE" \
            --limit "$BATCH_SIZE" \
            --workers 2 \
            --period 1y
