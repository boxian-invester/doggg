<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股智研 AI｜台灣股市分析平台</title><style>
:root{font-family:Inter,'Noto Sans TC',system-ui,sans-serif;color:#e9eefb;background:#0a1020}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:245px;background:#0d1729;border-right:1px solid #25344c;padding:24px 14px;overflow:auto}.brand{font-weight:850;font-size:23px;letter-spacing:.3px;padding:4px 12px 22px}.brand span{color:#45d4bb}.brand small{display:block;font-size:10px;color:#8494ad;letter-spacing:2px;margin-top:5px}.nav{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:10px;background:transparent;color:#9caac2;margin:3px 0;font-size:13px}.nav:hover,.nav.active{background:#18304a;color:#66e5cb}.nav b{display:inline-block;width:25px;color:#5d7898}.aside-foot{font-size:11px;color:#7d8ea7;line-height:1.8;padding:24px 12px}main{margin-left:245px;min-height:100vh;padding:27px 32px;max-width:1700px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:23px}.top h1{font-size:25px;margin:0 0 6px}.muted{color:#91a1bb;font-size:13px}.pill{display:inline-block;border-radius:30px;padding:7px 12px;background:#263347;color:#ffcb7b;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:#111e32;border:1px solid #263750;border-radius:14px;padding:19px;margin-bottom:16px}.stat{font-size:26px;font-weight:800;margin:10px 0 5px}.positive{color:#ff777d}.negative{color:#4ad6ae}.amber{color:#f6c575}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.section{font-size:19px;margin:25px 0 14px}.columns{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.subtle{font-size:12px;color:#8c9bb4}.tag{border:1px solid #36516d;border-radius:7px;padding:5px 8px;color:#9bc7ea;font-size:11px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{text-align:left;color:#94a5bf;font-weight:500;padding:13px 10px;border-bottom:1px solid #314057}td{padding:13px 10px;border-bottom:1px solid #23344b}input,select,textarea{background:#0b1728;color:#e8eefb;border:1px solid #354861;border-radius:8px;padding:10px;min-width:0}input[type=number]{width:120px}textarea{width:100%;min-height:90px}.btn{border:0;background:#38cdb0;color:#09211e;border-radius:8px;padding:10px 15px;font-weight:750}.btn.alt{background:#253c58;color:#cbdcf0}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.chart{width:100%;height:240px;display:block}.note{border-left:3px solid #f4bf6c;background:#27283b;padding:12px 15px;border-radius:6px;font-size:12px;color:#e4cda5;line-height:1.8}.hidden{display:none}.meter{height:9px;border-radius:9px;background:#26364c;overflow:hidden;margin-top:10px}.meter>div{height:100%;background:#39c8b4}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.formgrid label{display:flex;flex-direction:column;gap:7px;color:#a7b7ce;font-size:12px}.formgrid input,.formgrid select{width:100%}.report{background:#0d192b;border:1px solid #30435c;border-radius:10px;padding:16px;line-height:1.9;font-size:13px}.bars{display:flex;gap:8px;align-items:end;height:120px}.bars div{flex:1;background:#38cdb0;min-height:4px;border-radius:4px 4px 0 0;opacity:.75}.empty{color:#8e9eb6;padding:16px;text-align:center}.footer{font-size:11px;color:#8292aa;margin:35px 0 10px;line-height:1.8}@media(max-width:1050px){aside{position:static;width:auto;padding:12px}.brand{padding:5px}.navbox{display:flex;overflow:auto}.nav{min-width:155px}main{margin:0;padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}}@media(max-width:550px){.grid,.formgrid{grid-template-columns:1fr 1fr}.top{align-items:start;flex-direction:column}main{padding:13px}.card{padding:13px}.stat{font-size:21px}}
</style></head><body><aside><div class="brand">台股<span>智研 AI</span><small>TAIWAN STOCK INTELLIGENCE</small></div><div class="navbox" id="nav"></div><div class="aside-foot">V1.0 · 本機互動原型<br>示範行情非真實市場報價<br>不構成投資建議</div></aside><main><div class="top"><div><h1 id="page-title">市場總覽</h1><div class="muted" id="subtitle">美股連動 × 台股策略 × 風險控管</div></div><div class="pill">● DEMO 示範資料｜未連接即時行情</div></div><div id="content"></div><div class="footer">資料狀態：示範數據。正式版需串接授權行情、公開資訊與新聞資料；預測機率須經樣本外驗證、校準及交易成本測試。所有示範交易價格、報酬與勝率均不可作為真實下單依據。</div><section style="margin:20px 0;padding:18px;border:1px solid #40516b;border-radius:12px"><h2>真實歷史行情資料中心（非即時）</h2><p>本區連接行情 API，上方八大頁籤仍為 DEMO。</p><button onclick="liveLoad('us')">美股行情</button> <button onclick="liveLoad('watch')">台股觀察清單</button> <input id="live-sym" value="2330" style="width:85px"> <button onclick="liveLoad('stock')">查詢個股</button><pre id="live-result" style="white-space:pre-wrap;overflow:auto">選擇資料來源</pre></section></main><script>
const names=['美股與隔日台股預測','盤前當沖分析','每日 5 大交易機會','個股多週期技術分析','全球新聞交易策略','交易策略回測','投資組合風險管理','個人交易行為分析'];const subtitles=['美股走勢、產業輪動與隔日方向','09:00 前盤前候選與開盤確認','量價與動能條件式交易計畫','日線、週線與季線趨勢','新聞事件到交易假設','均線、KD、RSI、MACD 回測','相關性、集中度與壓力測試','20 筆交易與交易紀律'];let page=0;const $=s=>document.querySelector(s), fmt=n=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});const cards=(arr)=>`<div class="grid">${arr.map(a=>`<div class="card"><div class="subtle">${a[0]}</div><div class="stat ${a[2]||''}">${a[1]}</div><div class="subtle">${a[3]||'示範欄位'}</div></div>`).join('')}</div>`;const note=t=>`<div class="note">${t}</div>`;const table=(head,rows)=>`<div class="card table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;const lineChart=(seed=0)=>{let p=120,pts=[];for(let i=0;i<45;i++){p+=Math.sin(i*.65+seed)*6+Math.cos(i*.23+seed)*3+(seed%2?-.25:.8);pts.push([i*16+4,Math.max(24,Math.min(212,245-p))])}return `<svg class="chart" viewBox="0 0 720 240" preserveAspectRatio="none" role="img" aria-label="示意價格趨勢圖">${[45,90,135,180,225].map(y=>`<line x1="0" y1="${y}" x2="720" y2="${y}" stroke="#30415a" stroke-dasharray="4 6"/>`).join('')}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#46d9b8" stroke-width="3"/><text x="10" y="20" fill="#9eacc4" font-size="13">合成示意走勢（非行情）</text></svg>`};const stockRows=[['2330','台積電','半導體','量價突破待確認'],['8299','群聯','記憶體','均線多頭待確認'],['8046','南電','ABF 載板','MACD 翻正待確認'],['2344','華邦電','記憶體','KD 轉強待確認'],['2484','希華','電子零組件','量能擴張待確認']];
function nav(){ $('#nav').innerHTML=names.map((n,i)=>`<button class="nav ${i===page?'active':''}" onclick="show(${i})"><b>${String(i+1).padStart(2,'0')}</b>${n}</button>`).join('') }function show(i){page=i;nav();$('#page-title').textContent=names[i];$('#subtitle').textContent=subtitles[i];$('#content').innerHTML=views[i]();window.scrollTo(0,0)}
const views=[()=>`${cards([['美股科技股','待連接','', 'Nasdaq / S&P 500'],['費城半導體','待連接','','SOX 指數'],['隔日台股上漲機率','待建模','','需樣本外校準'],['模型可信度','尚無結果','','不可憑空產生機率']])}<div class="columns"><div class="card"><div class="row"><h3>美股與台股連動走勢</h3><span class="tag">合成示意</span></div>${lineChart()}<p class="subtle">正式版將對齊美股收盤與下一台股交易日，避免時區與假日造成前視偏誤。</p></div><div class="card"><h3>隔日漲跌機率模型</h3><p class="muted">輸入：Nasdaq、SOX、S&P 500、台積電 ADR、VIX、美元／台幣、產業相對強弱。</p><div class="report">預測方向：<b class="amber">等待真實資料</b><br>上漲機率：—<br>下跌機率：—<br>歷史樣本數：0<br>校準誤差：—<br>模型更新時間：—</div></div></div>${note('方向預測須定義標籤（例如下一交易日收盤高於前收盤），使用時間序列樣本外測試、機率校準及信賴區間；「上漲機率」不是保證。')}`,
()=>`${cards([['盤前報告','08:45','', '預計排程時間'],['候選股票','5 檔','','僅示範觀察清單'],['已確認進場訊號','0','','開盤後確認'],['勝率估計','待回測','','非主觀估計']])}<div class="card"><div class="row"><h3>當沖觀察清單</h3><span class="tag">盤前候選 ≠ 可立即下單</span></div><p class="muted">候選僅展示版型，尚未使用當日市場數據篩選。</p></div>${table(['代號','股票','產業','觀察條件','進場','停損','歷史勝率'],stockRows.map(r=>[r[0],r[1],r[2],r[3],'開盤確認後計算','—','樣本不足']))}<div class="card"><h3>當沖進場條件</h3><div class="report">① 前日相對成交量 > 1.8 倍（可調）<br>② 5 分 K 突破開盤區間高點<br>③ 即時量能與價格同步確認<br>④ 依當日波動幅度與結構停損設定進場、停損與目標<br>⑤ 收盤前強制平倉，計入手續費、交易稅與滑價</div></div>${note('台股開盤前無法知道當日已完成的 5 分 K 突破，網站必須先給「條件式計畫」，開盤後才標示訊號是否成立。')}`,
()=>`<div class="card"><h3>五大交易機會｜候選觀察清單</h3><p class="muted">以下股票僅供展示研究流程，不代表目前符合訊號。</p></div>${table(['股票','產業','成交量','KD','MACD','突破','進場 / 目標 / 停損','風險報酬比'],stockRows.map(r=>[r[0]+' '+r[1],r[2],'待接入','待計算','待計算','待確認','訊號確認後計算','—']))}<div class="card"><h3>交易計畫計算器</h3><div class="formgrid"><label>進場價<input id="entry" type="number" step="0.01" value="100"></label><label>目標價<input id="target" type="number" step="0.01" value="108"></label><label>停損價<input id="stop" type="number" step="0.01" value="97"></label><label>方向<select id="side"><option value="long">做多</option><option value="short">做空</option></select></label></div><button class="btn" onclick="calcRR()">計算風險報酬比</button><div id="rr-result" class="report" style="margin-top:12px">輸入價格並計算（預設數值僅示範）</div></div>`,
()=>`<div class="toolbar"><input id="symbol" placeholder="輸入股票代號，如 2330" value="2330"><button class="btn" onclick="symbolLookup()">分析標的</button><select id="timeframe" onchange="drawTimeframe()"><option value="日線">日線</option><option value="週線">週線</option><option value="季線">季線</option></select></div><div class="columns"><div class="card"><div class="row"><h3 id="symboltitle">2330 台積電</h3><span class="tag">示意圖</span></div><div id="timechart">${lineChart(2)}</div></div><div class="card"><h3>多週期分析報告</h3><div id="symbolreport" class="report">支撐與壓力：等待行情<br>趨勢線：等待高低點序列<br>MA5 / MA20 / MA60 / MA120：待計算<br>KD / MACD / RSI：待計算<br>操作判斷：<b class="amber">觀望（資料不足）</b></div></div></div>${note('週線按週彙總 OHLCV；季線按季度彙總 OHLCV，不以季均線替代季 K 線。正式版以完整歷史價格計算指標。')}`,
()=>`<div class="card"><h3>全球新聞 → 交易策略</h3><p class="muted">本版尚未接入新聞來源。可先使用事件情境分析工具建立研究假設。</p><div class="formgrid"><label>事件類型<select id="event"><option>AI 伺服器需求增加</option><option>記憶體供給緊縮</option><option>美國利率意外上升</option><option>地緣政治風險升高</option></select></label><label>預期影響期<select id="horizon"><option>短期 1–5 日</option><option>中期 1–3 個月</option><option>長期 6–12 個月</option></select></label></div><button class="btn" onclick="eventReport()">建立事件分析框架</button><div id="eventresult" class="report" style="margin-top:14px">請選擇事件後產生條件式研究框架。</div></div>${table(['消息來源','發佈時間','相關標的','市場反映','價格波動區間'],[['待接入','—','—','待驗證','須依歷史波動率估計']])}${note('新聞影響須區分事件時間、可交易時間、共識預期與已反映程度；預期波動區間需使用事件研究或波動率模型，不能憑新聞標題直接指定。')}`,
()=>`<div class="card"><h3>策略回測實驗室</h3><div class="formgrid"><label>策略<select id="strategy"><option value="ma">均線交叉 MA5/MA20</option><option value="kd">KD 金叉</option><option value="rsi">RSI 低檔反彈</option><option value="macd">MACD 柱狀體翻正</option></select></label><label>測試資料<select id="dataset"><option value="synthetic">合成價格序列（僅測試功能）</option></select></label><label>單邊交易成本 (%)<input type="number" id="fee" value="0.2" step="0.01" min="0"></label><label>初始資金<input type="number" id="capital" value="100000" min="1000"></label></div><button class="btn" onclick="runBacktest()">執行示範回測</button></div><div id="backtest-result">${cards([['總報酬','—'],['交易勝率','—'],['最大回撤','—'],['交易次數','—']])}</div>${note('此回測僅使用確定性的合成價格，驗證交易規則和計算功能，不可推論台股策略勝率。真實回測需採樣本外驗證、避免存活者偏誤與未來資料洩漏。')}`,
()=>`<div class="card"><h3>新增投資組合持股</h3><div class="formgrid"><label>股票代號<input id="holdsymbol" placeholder="2330"></label><label>產業<select id="holdsector"><option>半導體</option><option>記憶體</option><option>PCB / 載板</option><option>金融</option><option>其他</option></select></label><label>投入金額 (元)<input id="holdvalue" type="number" value="100000" min="1"></label><label>成本價<input id="holdcost" type="number" value="100" min="0.01" step="0.01"></label></div><button class="btn" onclick="addHolding()">加入持股</button> <button class="btn alt" onclick="clearHoldings()">清空持股</button></div><div id="holdings-result"></div>${note('組合 20% 下跌情境屬壓力測試，不等於預測。真正的相關性、Beta、VaR、避險比率與再平衡建議需以歷史價格和風險承受度計算。')}`,
()=>`<div class="card"><h3>匯入最近 20 筆交易</h3><p class="muted">每行一筆：股票代號,買進價,賣出價,股數,交易理由（選填）。支援貼上 20 筆或更多，分析最近 20 筆。資料保存在本瀏覽器。</p><textarea id="trades" placeholder="2330,100,105,1000,突破買進&#10;8299,200,195,200,追高買進"></textarea><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="analyzeTrades()">分析交易紀錄</button><button class="btn alt" onclick="clearTrades()">清空紀錄</button></div></div><div id="trade-result" class="card"><div class="empty">輸入交易紀錄後，計算交易表現與 3 條改善規則。</div></div>${note('僅有進出場結果，無法確定「錯過的機會」或心理偏誤；需額外提供交易日期、原定停損、交易計畫與未執行訊號，系統才可進一步驗證。')}`];
function calcRR(){let e=+$('#entry').value,t=+$('#target').value,s=+$('#stop').value,long=$('#side').value==='long';let gain=long?t-e:e-t,risk=long?e-s:s-e;$('#rr-result').innerHTML=e>0&&risk>0&&gain>0?`每股預期獲利：${fmt(gain)} 元<br>每股風險：${fmt(risk)} 元<br><b>風險報酬比：1 : ${fmt(gain/risk)}</b><br>未計入手續費、交易稅與滑價。`:'價格不符合此方向的獲利 / 停損邏輯，請重新輸入。'}function symbolLookup(){let s=$('#symbol').value.trim().replace(/[^0-9]/g,'').slice(0,6);if(!s)return;$('#symboltitle').textContent=s+(stockRows.find(r=>r[0]===s)?.[1]||' 個股');drawTimeframe()}function drawTimeframe(){let n=['日線','週線','季線'].indexOf($('#timeframe').value);$('#timechart').innerHTML=lineChart(n+2);$('#symbolreport').innerHTML=`${$('#timeframe').value}資料尚未接入。<br>支撐 / 壓力：—<br>主要趨勢線：—<br>均線與動能：—<br>判斷：<b class="amber">觀望（缺少實際資料）</b>`}function eventReport(){let e=$('#event').value,h=$('#horizon').value;$('#eventresult').innerHTML=`<b>研究事件：</b>${e}<br><b>時間範圍：</b>${h}<br><b>可能受影響產業：</b>需建立產業映射並驗證營收曝險<br><b>可能利多 / 利空：</b>待新聞事實與市場預期比對<br><b>股價是否反映：</b>比較事件前後超額報酬<br><b>預期波動區間：</b>待波動率 / 事件研究<br><b>配置方向：</b>尚無足夠資料，暫不提供比例<br><b>策略失效條件：</b>事件事實遭推翻、需求未轉化為營收或價格跌破預設風控門檻`}
function synthetic(){let arr=[];for(let i=0;i<360;i++)arr.push(100+i*.065+7*Math.sin(i*.12)+3*Math.sin(i*.47)+1.8*Math.cos(i*.8));return arr}function ema(a,p){let out=[],k=2/(p+1);a.forEach((v,i)=>out.push(i?out[i-1]+k*(v-out[i-1]):v));return out}function sma(a,p,i){if(i<p-1)return NaN;return a.slice(i-p+1,i+1).reduce((x,y)=>x+y,0)/p}function signal(a,i,type){if(i<40)return false;let prev=i-1;if(type==='ma')return sma(a,5,prev)<=sma(a,20,prev)&&sma(a,5,i)>sma(a,20,i);if(type==='rsi'){let r=j=>{let up=0,down=0;for(let k=j-13;k<=j;k++){let d=a[k]-a[k-1];up+=Math.max(0,d);down+=Math.max(0,-d)}return down===0?100:100-100/(1+up/down)};return r(prev)<=35&&r(i)>35}if(type==='kd'){let k=j=>{let lo=Math.min(...a.slice(j-8,j+1)),hi=Math.max(...a.slice(j-8,j+1));return hi===lo?50:100*(a[j]-lo)/(hi-lo)};return k(prev)<35&&k(i)>=35}let m=ema(a,12),l=ema(a,26),dif=m.map((v,j)=>v-l[j]),sig=ema(dif,9);return dif[prev]<=sig[prev]&&dif[i]>sig[i]}
function runBacktest(){let a=synthetic(),type=$('#strategy').value,cost=Math.max(0,+$('#fee').value)/100,capital=+$('#capital').value;if(!capital||capital<1000)return;let equity=capital,peak=capital,dd=0,entry=null,trades=[],curve=[];for(let i=40;i<a.length;i++){if(entry===null&&signal(a,i-1,type)){entry=a[i]*(1+cost);continue}if(entry!==null&&(i>=a.length-1||i%13===0)){let exit=a[i]*(1-cost),r=exit/entry-1;equity*=1+r;trades.push(r);entry=null}peak=Math.max(peak,equity);dd=Math.max(dd,1-equity/peak);curve.push(equity)}let win=trades.filter(x=>x>0).length;$('#backtest-result').innerHTML=cards([['總報酬',fmt((equity/capital-1)*100)+'%'],['交易勝率',trades.length?fmt(win/trades.length*100)+'%':'—'],['最大回撤',fmt(dd*100)+'%'],['交易次數',trades.length]])+`<div class="card"><h3>示範回測結果</h3><p class="muted">合成序列 360 根，訊號在第 i−1 根收盤確認，第 i 根價格進場；持有至固定退出條件。非實際 OHLCV 回測。</p>${lineChart(type.length)}</div>`}
const key='tsi_holdings_v1',tkey='tsi_trades_v1';let holdings=JSON.parse(localStorage.getItem(key)||'[]');function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addHolding(){let s=$('#holdsymbol').value.trim(),v=+$('#holdvalue').value,c=+$('#holdcost').value;if(!/^\d{4,6}$/.test(s)||v<=0||c<=0){alert('請輸入有效代號、金額與成本');return}holdings.push({s,v,c,sector:$('#holdsector').value});localStorage.setItem(key,JSON.stringify(holdings));renderHoldings()}function clearHoldings(){holdings=[];localStorage.removeItem(key);renderHoldings()}function renderHoldings(){let root=$('#holdings-result');if(!root)return;if(!holdings.length){root.innerHTML='<div class="card empty">尚未加入持股</div>';return}let sum=holdings.reduce((x,h)=>x+h.v,0),sectors={};holdings.forEach(h=>sectors[h.sector]=(sectors[h.sector]||0)+h.v);let top=Object.entries(sectors).sort((a,b)=>b[1]-a[1])[0],max=Math.max(...holdings.map(h=>h.v/sum));root.innerHTML=cards([['總投入金額',fmt(sum)+' 元'],['最大單一持股',fmt(max*100)+'%'],['最大產業曝險',fmt(top[1]/sum*100)+'%'],['市場下跌 20% 情境',fmt(-sum*.2)+' 元','negative','假設所有持股同步下跌 20%']])+table(['代號','產業','投入金額','權重','成本價'],holdings.map(h=>[safe(h.s),safe(h.sector),fmt(h.v),fmt(h.v/sum*100)+'%',fmt(h.c)]))+`<div class="card"><h3>組合風險診斷</h3><div class="report">${max>.35?'⚠ 單一標的權重超過 35%，有集中風險。':'單一標的配置未超過 35% 的示意警戒值。'}<br>${top[1]/sum>.5?'⚠ '+safe(top[0])+' 產業曝險超過 50%。':'最大產業：'+safe(top[0])+'。'}<br>隱藏相關性：待接入歷史報酬資料計算。<br>建議：設定單股與產業權重上限；再平衡比例需依風險承受度確認。<br>避險候選：現金、降低高 Beta 曝險、適當的避險工具；具體比例需先完成風險問卷。</div></div>`}
function analyzeTrades(){let raw=$('#trades').value.trim();localStorage.setItem(tkey,raw);let lines=raw.split(/\n/).filter(x=>x.trim()).slice(-20),rows=[],bad=0;for(let line of lines){let x=line.split(','),b=+x[1],s=+x[2],q=+x[3];if(!x[0]||b<=0||s<=0||q<=0){bad++;continue}rows.push({id:x[0],p:(s-b)*q,return:(s/b-1)*100,reason:x.slice(4).join(',')})}if(!rows.length){$('#trade-result').innerHTML='<div class="empty">請輸入有效交易紀錄，格式：代號,買進價,賣出價,股數,原因</div>';return}let wins=rows.filter(r=>r.p>0),loss=rows.filter(r=>r.p<0),avgwin=wins.length?wins.reduce((a,b)=>a+b.p,0)/wins.length:0,avgloss=loss.length?Math.abs(loss.reduce((a,b)=>a+b.p,0)/loss.length):0,net=rows.reduce((a,b)=>a+b.p,0);$('#trade-result').innerHTML=`<h3>最近 ${rows.length} 筆交易分析</h3>${cards([['已實現損益（未扣費）',fmt(net)+' 元'],['交易勝率',fmt(wins.length/rows.length*100)+'%'],['平均獲利 / 平均虧損',avgloss?fmt(avgwin/avgloss):'—'],['平均單筆報酬',fmt(rows.reduce((a,b)=>a+b.return,0)/rows.length)+'%']])}<div class="report"><b>三條立即執行的紀律規則</b><br>1. 每筆進場前填寫進場條件、停損點及目標價；未填寫不交易。<br>2. 每筆交易預設風險不超過總資金的 1%（可依風險承受度調整）。<br>3. 每週回顧損失最大的 3 筆交易，標記是否偏離原始計畫。<br><br>行為偏誤：目前無法僅憑進出價格判定。${bad?'<br>略過 '+bad+' 筆格式不正確資料。':''}</div>`}function clearTrades(){localStorage.removeItem(tkey);$('#trades').value='';$('#trade-result').innerHTML='<div class="empty">紀錄已清空</div>'}show(0);const originalShow=show;show=function(i){originalShow(i);if(i===6)renderHoldings();if(i===7)$('#trades').value=localStorage.getItem(tkey)||''};
async function liveLoad(type){let o=document.getElementById('live-result');o.textContent='讀取中…';let sym=document.getElementById('live-sym').value.trim();if(type==='stock'&&!/^\\d{4,6}$/.test(sym)){o.textContent='請輸入有效代號';return}let u=type==='us'?'/api/us-market':type==='watch'?'/api/watchlist':'/api/stock/'+sym;try{let r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.detail||'取得失敗');o.textContent=JSON.stringify(type==='stock'?{symbol:d.symbol,as_of:d.as_of,metrics:d.metrics,recent_candles:d.candles.slice(-5)}:d,null,2)}catch(e){o.textContent='資料暫不可用：'+e.message}}
</script></body></html>
